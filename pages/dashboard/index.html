<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Engram · 海马体记忆</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>
            <span class="brand-name">Engram</span>
            <span class="brand-sub">　类海马体长期记忆</span>
          </span>
        </div>
        <div class="status" id="health">连接中…</div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="overview">概览</button>
        <button class="tab" data-tab="memories">记忆列表</button>
        <button class="tab" data-tab="personas">用户画像</button>
        <button class="tab" data-tab="diary">日记</button>
        <button class="tab" data-tab="graph">关系图谱</button>
        <button class="tab" data-tab="recall">召回测试</button>
        <button class="tab" data-tab="backups">备份</button>
        <button class="tab" data-tab="prompts">提示词</button>
      </nav>

      <main>
        <!-- 概览 -->
        <section class="panel active" data-panel="overview">
          <div class="toolbar">
            <button class="btn btn-ghost btn-sm" id="btn-refresh-stats">刷新统计</button>
          </div>
          <div class="cards" id="stat-cards"></div>
          <div class="chart-grid" id="stat-charts"></div>
        </section>

        <!-- 记忆列表 -->
        <section class="panel" data-panel="memories">
          <div class="toolbar">
            <select id="mem-status" class="input input-sm" title="状态">
              <option value="active">活跃</option>
              <option value="archived">已归档</option>
              <option value="all">全部</option>
            </select>
            <input id="mem-search" class="input input-grow" placeholder="按内容检索（摘要/原文/用户标识，留空=全部）" />
            <input id="mem-k" class="input input-sm" type="number" value="50" min="1" max="500" title="数量" />
            <button class="btn" id="btn-load-mem">加载</button>
            <button class="btn btn-ghost btn-sm" id="btn-mem-batch-soft">批量软删除</button>
            <button class="btn btn-danger btn-sm" id="btn-mem-batch-hard">批量永久删除</button>
            <button class="btn btn-ghost btn-sm" id="btn-mem-export">导出JSON</button>
            <input id="mem-import-file" class="input input-sm" type="file" accept=".json,.csv" title="导入JSON/CSV" />
            <button class="btn btn-ghost btn-sm" id="btn-mem-import">预检</button>
            <button class="btn btn-sm" id="btn-mem-import-run">导入</button>
          </div>
          <div class="mem-grid" id="mem-rows">
            <div class="empty">点击「加载」查看记忆</div>
          </div>
          <div id="mem-detail" class="detail"></div>
        </section>

        <!-- 用户画像 -->
        <section class="panel" data-panel="personas">
          <div class="toolbar">
            <button class="btn" id="btn-load-personas">加载画像</button>
            <span class="toolbar-hint" id="personas-count"></span>
          </div>
          <div class="mem-grid" id="persona-rows">
            <div class="empty">点击「加载画像」查看用户画像</div>
          </div>
          <div id="persona-detail" class="detail"></div>
        </section>

        <!-- 日记 -->
        <section class="panel" data-panel="diary">
          <div class="toolbar">
            <select id="diary-channel" class="input input-sm" title="会话/群聊">
              <option value="">全部会话</option>
            </select>
            <select id="diary-persona" class="input input-sm" title="人格">
              <option value="">全部人格</option>
            </select>
            <select id="diary-day" class="input input-sm" title="日期">
              <option value="">全部日期</option>
            </select>
            <input id="diary-search" class="input input-grow" placeholder="按内容检索（留空=全部）" />
            <button class="btn" id="btn-load-diary">加载</button>
          </div>
          <div class="mem-grid" id="diary-rows">
            <div class="empty">点击「加载」查看日记</div>
          </div>
          <div class="pager" id="diary-pager"></div>
          <div id="diary-detail" class="detail"></div>
        </section>

        <!-- 关系图谱 -->
        <section class="panel" data-panel="graph">
          <div class="toolbar">
            <button class="btn" id="btn-load-graph">加载图谱</button>
            <button class="btn btn-ghost btn-sm" id="btn-graph-full">全量图谱</button>
            <span class="graph-legend" id="graph-legend"></span>
            <span class="graph-tip" id="graph-tip"></span>
          </div>
          <div class="graph-stage" id="graph-stage">
            <div class="empty">点击「加载图谱」查看实体关系网</div>
          </div>
          <div id="graph-detail" class="detail"></div>
        </section>
        <!-- 召回测试 -->
        <section class="panel" data-panel="recall">
          <div class="toolbar">
            <input id="rc-query" class="input input-grow" placeholder="输入查询语句…" />
            <select id="rc-mode" class="input input-sm">
              <option value="dual" selected>dual（可解释）</option>
              <option value="hybrid">hybrid</option>
              <option value="vector">vector</option>
              <option value="fts">fts</option>
            </select>
            <input id="rc-k" class="input input-sm" type="number" value="5" min="1" max="50" title="返回条数" />
            <button class="btn" id="btn-recall">召回</button>
          </div>
          <div id="rc-out"><div class="empty">输入查询并点击「召回」</div></div>
        </section>

        <!-- 提示词 -->
        <section class="panel" data-panel="prompts">
          <div class="toolbar">
            <button class="btn" id="btn-load-prompts">加载模板</button>
            <span class="toolbar-hint" id="prompts-count"></span>
          </div>
          <div class="prompt-grid" id="prompt-list"></div>
          <div class="detail" id="prompt-detail"></div>
        </section>

        <!-- 备份 -->
        <section class="panel" data-panel="backups">
          <div class="toolbar">
            <button class="btn btn-ghost btn-sm" id="btn-load-backups">加载备份列表</button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>备份 ID</th><th>时间</th><th>大小</th><th></th></tr></thead>
              <tbody id="bk-rows"><tr><td colspan="4" style="text-align:center;color:var(--text-2)">未加载</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
      <div id="toast" class="toast"></div>
    </div>
    <script src="./graph-2d.js"></script>
  <script src="./app.js"></script>
  </body>
</html>
